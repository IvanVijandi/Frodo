services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: sh -c "ollama serve"
    restart: unless-stopped
  
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/data
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4.0
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "8001:3000"
    depends_on:
      - "standalone"

  postgres:
    container_name: maria-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maria_pass}
      POSTGRES_DB: ${POSTGRES_DB:-maria_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maria_user} -d $${POSTGRES_DB:-maria_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: maria-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    container_name: maria-backend
    build: .
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      MILVUS_URI: http://standalone:19530
      OLLAMA_URI: ${OLLAMA_URI:-http://host.docker.internal:11434}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://maria_user:maria_pass@postgres:5432/maria_db}
      HF_HOME: /root/.cache/huggingface
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      RERANKER_TOP_K: ${RERANKER_TOP_K:-3}
    depends_on:
      standalone:
        condition: service_started
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    container_name: maria-frontend
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - "backend"
    restart: unless-stopped

volumes:
  ollama_data:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  pgadmin_data:
  huggingface_cache:
